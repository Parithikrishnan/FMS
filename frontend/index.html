<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · FMS</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" data-title="Dashboard">
  <main>
    <p class="page-desc">Overview of suspicious activity, open alerts and transactions.</p>

    <!-- Key Metrics Grid -->
    <section class="kpi-grid" id="kpis" aria-label="Key metrics"></section>

    <!-- Recent Alerts & Transactions -->
    <section class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>Recent Alerts</h2>
          <a class="link" href="html/alerts.html">View all →</a>
        </div>
        <div id="recent-alerts"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>Recent Transactions</h2>
          <a class="link" href="html/transactions.html">View all →</a>
        </div>
        <div id="recent-transactions"></div>
      </div>
    </section>

    <!-- Charts Grid -->
    <section class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>Transactions, last 7 days</h2>
          <div class="legend">
            <span style="--c: var(--chart-2)">All</span>
            <span style="--c: var(--chart-1)">Suspicious</span>
          </div>
        </div>
        <div class="card-body" id="chart-week"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>Alerts by severity</h2>
        </div>
        <div class="card-body" id="chart-severity"></div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
